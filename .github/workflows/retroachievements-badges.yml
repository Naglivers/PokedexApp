name: RetroAchievements badges
on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retroachievements-badges
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sincronizar badges vinculadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          RETROACHIEVEMENTS_SYNC_SECRET: ${{ secrets.RETROACHIEVEMENTS_SYNC_SECRET }}
        run: node scripts/sync-retroachievements.cjs
